<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>OpenCode</title>
  <style>
    /* Design tokens taken from the official OpenCode app (app.opencode.ai, theme oc-2) */
    :root {
      color-scheme: dark light;
      --grey-100:#fafafa; --grey-200:#f2f2f2; --grey-300:#eee; --grey-400:#dbdbdb;
      --grey-500:#aeaeae; --grey-600:gray; --grey-700:#5c5c5c; --grey-800:#3a3a3a;
      --grey-900:#2e2e2e; --grey-1000:#242424; --grey-1100:#161616; --grey-1200:#080808;
      --blue-300:#c3d4fd; --blue-400:#a2bcff; --blue-500:#7698fd; --blue-600:#3b5cf6;
      --blue-700:#3250df; --blue-800:#2c47c8; --blue-900:#263fa9;
      --green-300:#b8e9c1; --green-400:#96e3a6; --green-800:#198b43;
      --red-300:#f2bbb7; --red-500:#f17471; --red-800:#b82d35;
      --yellow-300:#f7e5b5; --yellow-800:#cb9f34; --yellow-900:#ac8833;
      --pink-400:#f799c6; --pink-800:#c83d8b;
      --purple-400:#9e99f7; --purple-700:#623be2;
      --radius-xs:2px; --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-xl:10px;
      --font-sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      --bg-deep:#080808; --bg-base:#161616;
      --layer-01:#242424; --layer-02:#2e2e2e; --layer-03:#3a3a3a; --layer-04:#5c5c5c;
      --text:#fafafa; --text-muted:#aeaeae; --text-faint:var(--grey-600);
      --icon:#dbdbdb; --icon-muted:var(--grey-600);
      --border:rgba(255,255,255,.1); --border-strong:rgba(255,255,255,.2); --border-muted:rgba(255,255,255,.05);
      --accent:#3b5cf6; --accent-text:#a2bcff; --accent-hover:#7698fd; --btn-neutral:rgba(255,255,255,.04);
      --agent-build:var(--blue-300); --agent-explore:var(--yellow-300); --agent-plan:var(--pink-400);
      --agent-review:var(--green-300); --agent-writer:var(--purple-400); --agent-other:var(--icon-muted);
      --shadow-md:0 6px 12px -2px rgba(0,0,0,.1),0 4px 8px -2px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.15);
      --shadow-lg:0 16px 48px -6px rgba(0,0,0,.15),0 6px 12px -2px rgba(0,0,0,.1),0 1px 2.5px rgba(0,0,0,.1);
      --sidebar:280px; --content:720px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-deep:#fafafa; --bg-base:#fff;
        --layer-01:#fafafa; --layer-02:#f2f2f2; --layer-03:#eee; --layer-04:#dbdbdb;
        --text:#161616; --text-muted:#5c5c5c; --text-faint:var(--grey-600);
        --icon:#3a3a3a; --icon-muted:var(--grey-600);
        --border:rgba(0,0,0,.1); --border-strong:rgba(0,0,0,.2); --border-muted:rgba(0,0,0,.05);
        --accent-text:#3b5cf6; --accent-hover:#3250df; --btn-neutral:#fff;
        --agent-build:var(--blue-800); --agent-explore:var(--yellow-900); --agent-plan:var(--pink-800);
        --agent-review:var(--green-800); --agent-writer:var(--purple-700);
        --shadow-md:0 6px 12px -2px rgba(0,0,0,.07),0 4px 8px -2px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.1);
        --shadow-lg:0 16px 48px -6px rgba(0,0,0,.05),0 6px 12px -2px rgba(0,0,0,.04),0 1px 2.5px rgba(0,0,0,.06);
      }
    }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body {
      margin:0; display:flex; flex-direction:column; height:100dvh; overflow:hidden;
      background:var(--bg-deep); color:var(--text);
      font:400 14px/1.5 var(--font-sans);
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    button,input,textarea { font:inherit; color:inherit; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    /* top bar */
    header {
      flex:none; height:48px; display:flex; align-items:center; gap:8px; padding:0 10px 0 14px;
      background:var(--bg-base); border-bottom:1px solid var(--border);
    }
    .mark {
      width:22px; height:22px; flex:none; border-radius:var(--radius-sm);
      background:linear-gradient(140deg,var(--blue-500),var(--blue-700));
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
    }
    header h1 { font-size:14px; font-weight:500; margin:0 auto 0 0; letter-spacing:-.16px; display:flex; align-items:baseline; gap:8px; min-width:0; }
    header h1 span { color:var(--text-muted); font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* hamburger menu */
    .menu-wrap { position:relative; flex:none; }
    .btn.icon { width:30px; padding:0; justify-content:center; }
    .burger { display:block; width:15px; height:11px; position:relative; }
    .burger::before, .burger::after, .burger i {
      content:""; position:absolute; left:0; right:0; height:1.5px; border-radius:9999px;
      background:currentColor; transition:transform .16s,opacity .12s,top .16s;
    }
    .burger::before { top:0; }
    .burger i { top:4.75px; }
    .burger::after { top:9.5px; }
    .btn.icon[aria-expanded="true"] .burger::before { top:4.75px; transform:rotate(45deg); }
    .btn.icon[aria-expanded="true"] .burger i { opacity:0; }
    .btn.icon[aria-expanded="true"] .burger::after { top:4.75px; transform:rotate(-45deg); }
    .menu {
      position:absolute; top:calc(100% + 6px); right:0; z-index:6;
      width:max-content; min-width:236px; max-width:min(92vw,320px); max-height:min(84dvh,760px);
      padding:4px; overflow:auto; display:none; flex-direction:column; gap:1px;
      background:var(--bg-base); border:1px solid var(--border);
      border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
    }
    .menu.show { display:flex; }
    .menu-item {
      display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
      padding:7px 8px; border:0; border-radius:var(--radius-md); background:transparent;
      color:var(--text-muted); font-size:13px; text-align:left; cursor:pointer; white-space:nowrap;
    }
    .menu-item:hover { background:var(--layer-02); color:var(--text); }
    .menu-item .kbd { color:var(--text-faint); font-size:11px; font-family:var(--font-mono); }
    .menu-sep { height:1px; margin:4px 6px; background:var(--border-muted); }
    .menu-head { padding:6px 8px 5px; color:var(--text-faint); font-size:11px; overflow:hidden; text-overflow:ellipsis; }
    .btn {
      display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px;
      border:1px solid var(--border); border-radius:var(--radius-md);
      background:var(--btn-neutral); color:var(--text); font-size:13px; font-weight:500;
      cursor:pointer; white-space:nowrap; transition:background .12s,border-color .12s,color .12s;
    }
    .btn:hover { background:var(--layer-02); border-color:var(--border-strong); }
    .btn:active { background:var(--layer-03); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn.primary:hover { background:var(--blue-700); border-color:var(--blue-700); }
    .btn.ghost { background:transparent; border-color:transparent; color:var(--text-muted); }
    .btn.ghost:hover { background:var(--layer-02); color:var(--text); }
    .btn .kbd { color:var(--text-faint); font-size:11px; font-family:var(--font-mono); }

    /* token block (lives inside the hamburger menu) */
    #auth { display:none; padding:2px 6px 4px; }
    #auth.show { display:flex; gap:6px; align-items:center; }
    #auth input { flex:1; min-width:0; height:30px; }
    #auth .btn { height:30px; padding:0 10px; flex:none; }

    /* shell: single column, the sidebar moved into the menu */
    .layout { flex:1; min-height:0; display:grid; grid-template-columns:1fr; }
    .menu-block { display:flex; flex-direction:column; min-height:0; }
    .aside-head { flex:none; display:flex; align-items:center; gap:6px; padding:8px 8px 6px; }
    .aside-head .aside-label { flex:1; }
    .aside-label { font-size:12px; font-weight:500; color:var(--text-faint); letter-spacing:.02em; text-transform:uppercase; }
    .aside-filter { flex:none; padding:0 6px 6px; }
    .aside-filter input { height:28px; font-size:12px; }
    #sessions { flex:none; max-height:min(38dvh,320px); overflow:auto; display:flex; flex-direction:column; gap:2px; padding:0 2px; }

    .group {
      font-size:12px; font-weight:500; color:var(--accent-text);
      padding:10px 8px 4px; letter-spacing:.02em;
    }
    .session {
      display:flex; align-items:center; gap:8px;
      width:100%; text-align:left; padding:6px 8px; border:0; border-radius:var(--radius-md);
      background:transparent; color:var(--text-muted); font-size:13px; cursor:pointer;
      transition:background .12s,color .12s;
    }
    .session:hover { background:var(--layer-02); color:var(--text); }
    .session.active { background:var(--layer-03); color:var(--text); }
    .session .dot { flex:none; width:6px; height:6px; border-radius:9999px; background:transparent; }
    .session.current .dot { background:var(--green-400); }
    .session .s-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
    .session .s-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .session.active .s-title, .session.current .s-title { font-weight:500; }
    .session .s-meta {
      display:flex; align-items:center; gap:6px; min-width:0;
      color:var(--text-faint); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .session .s-state { flex:none; font-size:11px; font-weight:500; }
    .session .s-state.running { color:var(--yellow-800); }
    .session .s-state.error { color:var(--red-500); }
    .s-actions { flex:none; display:flex; gap:2px; }
    .icon-btn {
      width:26px; height:26px; flex:none; display:grid; place-items:center; padding:0;
      border:0; border-radius:var(--radius-sm); background:transparent; color:var(--text-faint); cursor:pointer;
    }
    .icon-btn:hover { background:var(--layer-03); color:var(--text); }
    .icon-btn.danger:hover { color:var(--red-500); }
    .icon-btn svg { width:14px; height:14px; }
    .session .s-edit { height:28px; font-size:13px; }
    .session .s-ask { display:flex; align-items:center; gap:6px; flex:1; min-width:0; color:var(--text); font-size:13px; }
    .session .s-ask .yes { color:var(--red-500); font-weight:500; }
    .project, .s-model {
      flex:none; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      padding:0 5px; border:1px solid var(--border-muted); border-radius:var(--radius-xs);
      font-size:10px; color:var(--text-faint);
    }
    .s-model { font-family:var(--font-mono); }
    .session.editing { background:var(--layer-02); }
    @media (hover: none) { .s-actions { opacity:.85; } }
    .agent { color:var(--agent-other); }
    .agent[data-agent="build"] { color:var(--agent-build); }
    .agent[data-agent="explore"] { color:var(--agent-explore); }
    .agent[data-agent="plan"] { color:var(--agent-plan); }
    .agent[data-agent="review"] { color:var(--agent-review); }
    .agent[data-agent="writer"] { color:var(--agent-writer); }
    .aside-empty { padding:6px 8px; color:var(--text-faint); font-size:12px; }

    main { min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--bg-deep); }

    /* dock: status on top, input in the middle, model line under — one block */
    #dock { flex:none; display:flex; flex-direction:column; position:relative; z-index:2; background:var(--bg-base); }
    #livebar {
      flex:none; display:flex; flex-direction:column; position:relative; z-index:3;
      background:var(--bg-base); border-top:1px solid var(--border);
    }
    #modelLine {
      flex:none; display:flex; align-items:center; gap:8px; padding:0 20px calc(7px + env(safe-area-inset-bottom));
      color:var(--text-faint); font-size:11.5px; white-space:nowrap; overflow:hidden;
    }
    #modelLine > * { flex:none; }
    #modelLine .m-name { overflow:hidden; text-overflow:ellipsis; }
    #modelLine .m-name { color:var(--text-muted); }
    #modelLine .m-model { font-family:var(--font-mono); }
    #modelLine .m-sep { color:var(--border-strong); }
    #status {
      display:flex; align-items:center; gap:7px; min-height:0; height:0; overflow:hidden;
      padding:0 20px; color:var(--text-faint); font-size:12px; white-space:nowrap; text-overflow:ellipsis;
      transition:height .15s;
    }
    #status.on { height:30px; }
    #status::before { content:""; width:6px; height:6px; border-radius:9999px; background:var(--green-400); flex:none; }
    #status.busy::before { background:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
    #status.bad::before { background:var(--red-500); }
    #activity {
      display:flex; align-items:center; gap:8px; height:0; overflow:hidden; padding:0 20px;
      color:var(--text-muted); font-size:12px; white-space:nowrap; transition:height .15s,padding .15s;
    }
    #activity.on { height:26px; }
    #activity .spin {
      width:11px; height:11px; flex:none; border-radius:9999px;
      border:1.5px solid var(--border-strong); border-top-color:var(--accent);
      animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg) } }
    #activity .act { overflow:hidden; text-overflow:ellipsis; }
    #activity .tools { margin-left:auto; flex:none; color:var(--text-faint); font-family:var(--font-mono); font-size:11px; }
    #notice { color:var(--red-500); font-size:12px; }
    #notice:not(:empty) { padding:6px 20px 0; }

    /* transcript */
    #messages { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; padding:20px 20px 8px; gap:14px; }
    #messages > * { width:100%; max-width:var(--content); margin:0 auto; }
    .message { display:flex; flex-direction:column; gap:8px; }
    .message .role { display:flex; align-items:center; gap:6px; color:var(--text-faint); font-size:12px; font-weight:500; }
    .message .role::before { content:""; width:6px; height:6px; border-radius:9999px; background:var(--icon-muted); }
    .message.user { align-self:flex-end; max-width:min(85%,560px); margin-left:auto; margin-right:0; }
    .message.user .role { justify-content:flex-end; }
    .message.user .role::before { display:none; }
    .message .body { font-size:14px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
    .message.user .body { padding:10px 14px; border-radius:var(--radius-lg); background:var(--layer-01); border:1px solid var(--border-muted); }
    .message .tools { display:flex; flex-direction:column; gap:6px; }
    .stream-card .role::before { background:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
    .empty { margin:auto; max-width:420px; text-align:center; color:var(--text-faint); font-size:14px; line-height:1.5; }

    /* transcript toolbar */
    #bar { flex:none; display:flex; align-items:center; gap:8px; padding:0 20px 8px; }
    #bar .btn { height:24px; padding:0 8px; font-size:11px; font-weight:400; color:var(--text-faint); }
    #bar .btn:hover { color:var(--text); }
    #bar .count { color:var(--text-faint); font-size:11px; }

    /* markdown */
    .md { font-size:14px; line-height:1.55; overflow-wrap:anywhere; }
    .md > *:first-child { margin-top:0; }
    .md > *:last-child { margin-bottom:0; }
    .md h1, .md h2, .md h3, .md h4 { margin:16px 0 8px; font-weight:500; letter-spacing:-.16px; }
    .md h1 { font-size:20px; } .md h2 { font-size:17px; } .md h3 { font-size:15px; } .md h4 { font-size:14px; }
    .md p { margin:8px 0; }
    .md ul, .md ol { margin:8px 0; padding-left:20px; }
    .md li { margin:2px 0; }
    .md a { color:var(--accent-text); text-decoration:none; border-bottom:1px solid var(--border-strong); }
    .md blockquote { margin:8px 0; padding:2px 0 2px 10px; border-left:2px solid var(--border-strong); color:var(--text-muted); }
    .md hr { border:0; border-top:1px solid var(--border); margin:14px 0; }
    .md code { font-family:var(--font-mono); font-size:12.5px; padding:1px 4px; border-radius:var(--radius-xs); background:var(--layer-02); }
    .md table { border-collapse:collapse; margin:8px 0; font-size:13px; display:block; overflow:auto; }
    .md th, .md td { border:1px solid var(--border); padding:4px 8px; text-align:left; }
    .md th { background:var(--layer-02); font-weight:500; }

    /* code + diff blocks */
    .code { margin:8px 0; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; background:var(--bg-base); }
    .code-head { display:flex; align-items:center; gap:8px; padding:5px 8px; background:var(--layer-01); border-bottom:1px solid var(--border-muted); }
    .code-head .lang { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }
    .code-head .copy { margin-left:auto; height:20px; padding:0 7px; font-size:11px; color:var(--text-faint); background:transparent; border:1px solid var(--border-muted); border-radius:var(--radius-sm); cursor:pointer; }
    .code-head .copy:hover { color:var(--text); background:var(--layer-02); }
    .code pre { margin:0; padding:10px 12px; overflow:auto; font-family:var(--font-mono); font-size:12.5px; line-height:1.5; }
    .tok-key { color:var(--purple-400); } .tok-str { color:var(--green-400); } .tok-num { color:var(--yellow-300); }
    .tok-com { color:var(--text-faint); font-style:italic; } .tok-fn { color:var(--blue-400); } .tok-punct { color:var(--icon-muted); }
    .tok-add { color:var(--green-400); background:rgba(73,201,112,.12); display:block; }
    .tok-del { color:var(--red-500); background:rgba(249,72,79,.12); display:block; }
    .tok-gap { color:var(--text-faint); background:var(--layer-01); display:block; }
    .diff { margin:8px 0; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; background:var(--bg-base); }
    .diff-file { padding:5px 10px; background:var(--layer-01); border-bottom:1px solid var(--border-muted); color:var(--text-muted); font-family:var(--font-mono); font-size:11.5px; }
    .diff pre { margin:0; padding:6px 0; overflow:auto; font-family:var(--font-mono); font-size:12.5px; line-height:1.5; }
    .diff pre span { padding:0 10px; }
    @media (prefers-color-scheme: light) {
      .tok-key { color:var(--purple-700); } .tok-str { color:var(--green-800); } .tok-num { color:var(--yellow-900); } .tok-fn { color:var(--blue-800); }
      .tok-add { color:var(--green-800); background:rgba(73,201,112,.14); }
      .tok-del { color:var(--red-800); background:rgba(249,72,79,.12); }
    }

    /* tool cards */
    .tool { border:1px solid var(--border-muted); border-radius:var(--radius-md); background:var(--bg-base); overflow:hidden; }
    .tool.failed { border-color:var(--red-500); }
    .tool-head { display:flex; align-items:center; gap:8px; width:100%; padding:6px 8px; border:0; background:transparent; color:var(--text-muted); font-size:12.5px; cursor:pointer; text-align:left; }
    .tool-head:hover { background:var(--layer-02); color:var(--text); }
    .tool-head .t-icon { flex:none; width:16px; text-align:center; color:var(--text-faint); }
    .tool-head .t-label { flex:none; color:var(--text); }
    .tool-head .t-arg { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-faint); font-family:var(--font-mono); font-size:11.5px; }
    .tool-head .t-stat { flex:none; font-size:11px; font-family:var(--font-mono); }
    .tool-head .t-stat .add { color:var(--green-400); } .tool-head .t-stat .del { color:var(--red-500); }
    .tool-body { display:none; padding:0 8px 8px; }
    .tool.open .tool-body { display:block; }
    .tool-body .args { margin:0 0 6px; padding:6px 8px; border-radius:var(--radius-sm); background:var(--layer-01); color:var(--text-faint); font-family:var(--font-mono); font-size:11px; white-space:pre-wrap; overflow-wrap:anywhere; max-height:180px; overflow:auto; }
    .tool-body .out { margin:0; font-family:var(--font-mono); font-size:12px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; max-height:340px; overflow:auto; }
    .tool-body .more { margin-top:6px; height:22px; padding:0 8px; font-size:11px; }
    .tool-group { border:1px solid var(--border-muted); border-radius:var(--radius-md); background:var(--bg-base); overflow:hidden; }
    .tool-group > .tool { border:0; border-top:1px solid var(--border-muted); border-radius:0; background:transparent; }
    .tool-group > .tool:first-of-type { border-top:0; }
    .tool-group .group-head { display:flex; align-items:center; gap:8px; width:100%; padding:6px 8px; border:0; background:transparent; color:var(--text); font-size:12.5px; cursor:pointer; }
    .tool-group .group-head .n { margin-left:auto; color:var(--text-faint); font-family:var(--font-mono); font-size:11px; }
    .tool-group.closed > .tool { display:none; }
    #messages.tools-off .tool, #messages.tools-off .tool-group, #messages.tools-off .turn-meta { display:none; }

    /* reasoning */

      state.cursor = Number(data.runtime && data.runtime.event_cursor) || 0; state.active = Boolean(data.runtime && data.runtime.active);
      state.sessionMeta = { agent: data.agent || '', model: data.model || '', directory: data.directory || '' };
      renderModelLine();
      renderMessages(data.messages || []); await refreshSessions(); if (state.active) { setStatus('Working on it…'); streamSession(); }
    }
    function streamCount() { return (window.__streams = (window.__streams || 0) + 1); }
    function stopStream() { if (state.controller) { try { state.controller.abort(); } catch (_) {} } state.controller = null; state.streaming = ''; }
    /* ---------- live turn log ----------
       One plain state object per turn, re-rendered after every event. Segments
       keep chronological order (think -> tool -> think -> reply) so the live
       view reads exactly like the TUI transcript, and nothing depends on
       incremental DOM patches. */
    function turnNew() {
      state.turn = { segments: [], text: '', thinking: '', notes: [], tools: [], usage: 0, model: '', role: '', started: Date.now(), done: 0, filled: 0 };

    }
    function segOf(type) { const segs = state.turn.segments; for (let i = segs.length - 1; i >= 0; i--) if (segs[i].type === type) return segs[i]; return null; }
    function renderLive() {
      const t = state.turn;
      if (!t) return;

      role.textContent = 'assistant · live' + (t.role ? ' · ' + t.role : ''); root.append(role);

        const head = document.createElement('div'); head.className = 'seg-head';
        const label = document.createElement('span'); label.className = 'seg-label';
        const body = document.createElement('div'); body.className = 'seg-body';
        if (seg.type === 'think') {

          const open = seg.open === true;                      // collapsed unless asked for
          const think = document.createElement('details'); think.className = 'reason live-think'; think.open = open;
          const sum = document.createElement('summary');
          sum.textContent = (seg.done ? 'Thought' : 'Thinking…') + ' (' + words + ' words)';
          body.textContent = seg.text;
          sum.onclick = () => { seg.open = !open; };
          think.append(sum, body); wrap.append(think);
        } else if (seg.type === 'text') {
          label.textContent = 'Reply'; head.append(label);
          body.textContent = seg.text; wrap.append(head, body);
        } else if (seg.type === 'tool') {
          const card = toolCard({ function: { name: seg.name, arguments: seg.args || {} } }, seg.out || null, seg.phase === 'run' ? 'running' : null, seg.seconds, seg.open === true, () => { seg.open = !seg.open; renderLive(); });
          if (seg.phase === 'run') card.classList.add('live-running');
          if (seg.status === 'denied') { card.classList.add('failed'); const badge = document.createElement('div'); badge.className = 'seg-head'; badge.textContent = 'denied by you'; card.append(badge); }
          if (seg.progress) { const pr = document.createElement('div'); pr.className = 'seg-head'; pr.textContent = 'progress ' + seg.progress; card.append(pr); }
          if (seg.out && seg.phase === 'done') card.classList.add('has-output');
          wrap.append(card);
        } else if (seg.type === 'note') {
          label.textContent = seg.text; head.append(label); wrap.append(head);
        }
        root.append(wrap);
      }
      liveScroll(previousHeight);
    }
    // Auto-scroll ONLY when the reader is already at the bottom. Scrolling up to
    // read stays put; when a segment is added above the viewport the scroll
    // offset is corrected so the visible text does not jump.
    function atBottom() { const box = $('messages'); return box.scrollHeight - box.scrollTop - box.clientHeight < 48; }
    function liveScroll(previousHeight) {
      const box = $('messages');
      if (previousHeight == null) { if (state.stick) box.scrollTop = box.scrollHeight; return; }
      const grew = box.scrollHeight - previousHeight;
      if (state.stick) box.scrollTop = box.scrollHeight;
      else if (grew > 0) box.scrollTop += grew;   // keep the same content under the eyes
    }
    function liveRole(text) { if (!state.turn) return; state.turn.role = text || ''; }
    function liveThink(delta) {
      if (!state.turn) turnNew();
      const last = state.turn.segments[state.turn.segments.length - 1];
      let seg = last && last.type === 'think' ? last : null;
      if (!seg) { seg = { type: 'think', text: '', done: false }; state.turn.segments.push(seg); }
      seg.text += delta || ''; state.turn.thinking = seg.text; renderLive();
    }
    function liveText(delta) {
      if (!state.turn) turnNew();
      const last = state.turn.segments[state.turn.segments.length - 1];
      let seg = last && last.type === 'text' ? last : null;
      if (!seg) { seg = { type: 'text', text: '' }; state.turn.segments.push(seg); }
      seg.text += delta || ''; state.turn.text = seg.text;
      for (const item of state.turn.segments) if (item.type === 'think') item.done = true;
      state.turn.role = '';
      renderLive();
    }
    function liveTool(event, phase) {
      if (!state.turn) turnNew();
      const name = String(event.tool || 'tool');
      const id = String(event.call_id || '');
      if (phase === 'start' || phase === 'call') {
        for (const item of state.turn.segments) if (item.type === 'think') item.done = true;
        const seg = { type: 'tool', name, callId: id, phase: 'run', t0: Date.now(), args: parseArgs(event.input || event.arguments), out: '', seconds: 0, status: 'running', open: Boolean(EDIT_TOOLS[name]) };
        state.turn.segments.push(seg);
        state.turn.tools.push(seg);
        state.turn.role = 'using ' + (TOOL_SHORT[name] || name.replace(/_/g, ' '));
        renderLive();
        return;
      }
      if (phase === 'progress') {
        const seg = liveSegById(id, name);
        if (seg) { seg.progress = (event.done || 0) + '/' + (event.total || '?'); renderLive(); }
        return;
      }
      const seg = liveSegById(id, name);
      if (!seg) return;
      seg.phase = 'done';
      seg.seconds = (Date.now() - seg.t0) / 1000;
      seg.status = String(event.status || (phase === 'denied' ? 'denied' : 'completed'));
      const output = event.output != null ? event.output : '';
      if (output) seg.out = { content: textOf(output) };
      if (event.input || event.arguments) seg.args = parseArgs(event.input || event.arguments);
      state.turn.role = '';
      renderLive();
    }
    function liveSegById(id, name) {
      const segs = state.turn.segments;
      for (let i = segs.length - 1; i >= 0; i--) { const item = segs[i]; if (item.type !== 'tool' || item.phase !== 'run') continue; if (id && item.callId) { if (item.callId === id) return item; } else if (item.name === name) return item; }
      return null;
    }
    function liveNote(text) {
      if (!state.turn) turnNew();
      state.turn.notes.push(text);
      if (state.turn.notes.length > 4) state.turn.notes.shift();
      state.turn.segments.push({ type: 'note', text });
      while (state.turn.segments.filter(x => x.type === 'note').length > 4) { const i = state.turn.segments.findIndex(x => x.type === 'note'); state.turn.segments.splice(i, 1); }
      renderLive();
    }
    function clearLive() { if (state.liveRoot) state.liveRoot.remove(); state.liveRoot = null; state.turn = null; }

    function handleEvent(event) {
      const seq = Number(event.seq) || 0;
      if (seq && state.cursor && seq > state.cursor + 1 && !state.gapChecked) { state.gapChecked = true; if (!state.active) refreshTranscript().catch(() => {}); }
      state.cursor = Math.max(state.cursor, seq);
      const kind = event.kind;
      if (kind === 'turn_started') { state.streamText = ''; state.intent++; clearLive(); turnNew(); state.active = true; state.toolCount = 0; state.tokens = 0; state.retries = 0; state.startedAt = Date.now(); state.liveRole = 'assistant · live'; state.bad = false; showNotice(''); setStatus('Working on it…'); setActivity('Starting the agent', toolSummary()); return; }
      if (kind === 'step') { setStatus('Working on it…'); if (!state.turn || !state.turn.segments.length) setActivity('Working out the next step…', toolSummary()); return; }
      if (kind === 'tool_start' || kind === 'tool_call') { state.toolCount = (state.toolCount || 0) + 1; liveTool(event, 'start'); setActivity(describeTool(event.tool, 'start'), toolSummary()); return; }
      if (kind === 'tool_complete' || kind === 'tool_end') { liveTool(event, 'end'); setActivity(describeTool(event.tool, 'end'), toolSummary()); return; }
      if (kind === 'tool_progress') { liveTool(event, 'progress'); return; }
      if (kind === 'tool_denied') { liveTool(event, 'denied'); setActivity('Permission needed for ' + (TOOL_SHORT[event.tool] || event.tool), toolSummary()); return; }
      if (kind === 'reasoning_delta') { liveThink(event.text); setActivity('Thinking…', toolSummary()); return; }
      if (kind === 'text_delta') { liveText(event.text); setActivity('Writing the reply…', toolSummary()); return; }
      if (kind === 'usage') { const u = event.usage || {}; const tokens = Number(u.input || 0) + Number(u.output || 0); if (tokens) state.tokens = tokens; return; }
      if (kind === 'notice') { const note = event.text || event.message; if (note) liveNote(note); setActivity(note || 'Working…', toolSummary()); return; }
      if (kind === 'prompt_queued' || kind === 'prompt_promoted') { setStatus('Queued — will run next'); setActivity('Prompt queued', toolSummary()); return; }
      if (kind === 'auto_continue') { setActivity('Continuing automatically…', toolSummary()); return; }
      if (kind === 'bg_collected') { setActivity('Collected sub-agent: ' + (event.title || 'done'), toolSummary()); return; }
      if (kind === 'interrupted') { state.active = false; setStatus('Stopped'); setActivity(''); clearLive(); refreshTranscript().catch(() => {}); return; }
      if (kind === 'error' || kind === 'session_save_error') { state.bad = true; setStatus('Error'); setActivity(''); showNotice(event.error || event.text || 'Something went wrong'); return; }
      if (kind === 'turn_complete') {
        state.active = false; state.streamText = ''; state.bad = false; showNotice('');
        const r = event.result || {}; const u = r.usage || {};
        clearLive();
        state.lastTurn = { model: r.model_id || state.model || '', retry: Number(r.retries || 0), in: Number(u.input || u.prompt_tokens || 0), out: Number(u.output || u.completion_tokens || 0), tools: Number(r.tool_calls_made || 0), seconds: state.startedAt ? (Date.now() - state.startedAt) / 1000 : 0 };
        const summary = toolSummary();
        setStatus(summary ? 'Ready · ' + summary : 'Ready'); setActivity('');
        refreshTranscript().catch(() => {});
        return;
      }
      if (kind === 'turn_error') { state.active = false; state.streamText = ''; state.bad = true; setStatus('Turn failed'); setActivity(''); clearLive(); showNotice(event.error || 'The turn failed'); refreshTranscript().catch(() => {}); return; }
    }
    async function refreshTranscript() {
      if (!state.sessionId || state.active) return;   // the live log owns the view during a turn
      const id = state.sessionId;
      const data = await api('sessions/' + encodeURIComponent(id));
      if (state.sessionId !== id) return;
      state.cursor = Math.max(state.cursor, Number(data.runtime && data.runtime.event_cursor) || 0);
      renderMessages(data.messages || []);
    }
    async function streamSession() {
      if (!state.sessionId || !state.token) return;
      if (state.streaming === state.sessionId) return;   // one stream per session, no duplicates
      stopStream();
      streamCount();
      state.streaming = state.sessionId;
      const controller = new AbortController(); state.controller = controller; state.gapChecked = false; window.__stream = { after: state.cursor, status: 0 };
      try {
        const response = await fetch('/api/v1/sessions/' + encodeURIComponent(state.sessionId) + '/events?after=' + state.cursor, { headers: { 'Accept': 'text/event-stream', 'Authorization': 'Bearer ' + state.token }, signal: controller.signal });
        if (window.__stream) window.__stream.status = response.status;
        if (response.status === 401) { markTokenRejected(); return; }
        if (!response.ok) throw new Error('event stream failed (' + response.status + ')');
        const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = '';
        while (true) { const part = await reader.read(); if (part.done) break; buffer += decoder.decode(part.value, { stream: true }); let split; while ((split = buffer.indexOf('\n\n')) >= 0) { const block = buffer.slice(0, split); buffer = buffer.slice(split + 2); for (const line of block.split('\n')) if (line.startsWith('data:')) handleEvent(JSON.parse(line.slice(5).trim())); } }
        if (state.active) refreshTranscript().catch(() => {});
      } catch (error) { if (error.name !== 'AbortError') { setStatus('Live updates stopped'); setActivity(''); } } finally { if (state.controller === controller) state.controller = null; }
    }
    async function sendPrompt(event) { event.preventDefault(); const content = $('prompt').value.trim(); if (!content || !state.sessionId) { showNotice(state.sessionId ? 'Enter a message.' : 'Select a session first.'); return; } $('prompt').value = ''; showNotice(''); appendLocal(content); try { await api('sessions/' + encodeURIComponent(state.sessionId) + '/messages', { method: 'POST', body: { content } }); state.active = true; setStatus('Working on it…'); setActivity('Sending your prompt…'); if (!state.controller) streamSession(); } catch (error) { showNotice(error.message); refreshTranscript().catch(() => {}); } }
    function appendLocal(content) {
      const card = document.createElement('article'); card.className = 'message user pending';
      const role = document.createElement('div'); role.className = 'role'; role.textContent = 'you';
      const body = document.createElement('div'); body.className = 'body'; body.textContent = content;
      card.append(role, body); $('messages').append(card); $('messages').scrollTop = $('messages').scrollHeight;
    }
    async function abortTurn() { if (!state.sessionId) return; try { await api('sessions/' + encodeURIComponent(state.sessionId) + '/abort', { method: 'POST', body: {} }); } catch (error) { showNotice(error.message); } }
    async function boot() {
      if (!state.token) { setStatus('Enter server token'); showToken(); return; }
      try {
        const info = await api('info'); state.bad = false; state.tokenRejected = false; showNotice(''); setStatus('Connected · ' + info.directory); const dir = info.directory || ''; $('dirLabel').textContent = dir ? dir.split('/').pop() : ''; $('menuDir').textContent = dir;
        const sessions = await refreshSessions();
        // Only auto-pick when the user has not chosen (or started) anything: a slow
        // session list used to land here after a send and yank the view away.
        if (sessions.length && !state.sessionId && !state.active) await selectSession(sessions[0].id);

    }
    $('showToken').onclick = showToken; $('saveToken').onclick = saveToken; $('newSession').onclick = () => { closeMenu(); createSession().catch(error => showNotice(error.message)); }; $('abort').onclick = () => { closeMenu(); abortTurn(); }; $('promptForm').onsubmit = sendPrompt; $('token').addEventListener('keydown', event => { if (event.key === 'Enter') saveToken(); });
    $('sessionFilter').addEventListener('input', event => { state.filter = event.target.value; refreshSessions().catch(() => {}); });
    $('refreshSessions').onclick = () => refreshSessions().catch(error => showNotice(error.message));
    $('messages').addEventListener('scroll', () => { state.stick = atBottom(); });
    $('menuButton').onclick = event => { event.stopPropagation(); toggleMenu(); };
    $('toolsToggle').onclick = () => { state.showTools = !state.showTools; localStorage.setItem('opencode_show_tools', state.showTools ? '1' : '0'); $('messages').classList.toggle('tools-off', !state.showTools); $('toolsToggle').textContent = state.showTools ? 'Hide tool calls' : 'Show tool calls'; };
    $('modelButton').onclick = openModels; $('closeModels').onclick = closeModels;
    $('sessionsButton').onclick = openSessions; $('closeSessions').onclick = closeSessions;
    $('controlButton').onclick = () => { closeMenu(); window.open('/control.html', '_blank', 'noopener'); };
    $('newSession2').onclick = () => { closeSessions(); createSession().catch(error => showNotice(error.message)); };
    $('sessionModal').addEventListener('click', event => { if (event.target === $('sessionModal')) closeSessions(); });
    $('modelSearch').addEventListener('input', event => { state.modelQuery = event.target.value; renderModels(); });
    $('modelModal').addEventListener('click', event => { if (event.target === $('modelModal')) closeModels(); });
    document.addEventListener('click', event => { if (!event.target.closest('.menu-wrap') && !$('auth').classList.contains('show')) closeMenu(); });
    document.addEventListener('keydown', event => { if (event.key !== 'Escape') return; if ($('modelModal').classList.contains('show')) closeModels(); else if ($('sessionModal').classList.contains('show')) { state.editingId = ''; state.confirmId = ''; closeSessions(); } else if ($('auth').classList.contains('show')) { $('auth').classList.remove('show'); if (state.token) closeMenu(); } else closeMenu(); });
    setModelLabel(); boot();
  </script>
